plugins {
    id 'com.android.application'
}

android {
    namespace 'com.letmese.aikeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.letmese.aikeyboard"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'kotlin-stdlib 1.8.22 merges jdk7' }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'kotlin-stdlib 1.8.22 merges jdk8' }
    }
}
