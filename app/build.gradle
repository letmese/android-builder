plugins {
    id 'com.android.application'
}

android {
    namespace 'com.letmese.aikeyboard'
    compileSdk 35

    defaultConfig {
        applicationId "com.letmese.aikeyboard"
        minSdk 24
        targetSdk 35
        versionCode 50
        versionName "2.8"
    }

    signingConfigs {
        debug {
            // Default debug keystore — auto-generated by the SDK
            storeFile file("${System.properties['user.home']}/.android/debug.keystore")
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storePassword 'android'
        }
        release {
            // CI: uses env-var keystore; local: falls back to debug
            def ksPath = System.getenv("KEYSTORE_PATH")
            storeFile file(ksPath ?: "${System.properties['user.home']}/.android/debug.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
            keyAlias System.getenv("KEY_ALIAS") ?: "androiddebugkey"
            keyPassword System.getenv("KEY_PASSWORD") ?: "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
