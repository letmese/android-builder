plugins {
    id 'com.android.application'
}

android {
    namespace 'com.letmese.aikeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.letmese.aikeyboard"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
