plugins {
    id 'com.android.application'
}

android {
    namespace 'com.letmese.aikeyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.letmese.aikeyboard"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "2.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
